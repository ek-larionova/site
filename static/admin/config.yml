backend:
  name: github
  repo: ek-larionova/site
  branch: main

site_url: https://www.ekaterinalarionova.eu
display_url: https://www.ekaterinalarionova.eu
publish_mode: editorial_workflow

media_folder: static/images/uploads
public_folder: /images/uploads

collections:
  - name: calendar
    label: Календарь
    delete: false
    editor:
      preview: false
    files:
      - name: calendar_en
        label: Calendar EN
        file: content/calendar/_index.md
        format: toml-frontmatter
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Template, name: template, widget: hidden, default: calendar/section.html }
          - label: Extra
            name: extra
            widget: object
            fields:
              - { label: Intro, name: intro, widget: text }
              - { label: Widget title, name: widget_title, widget: string }
              - { label: Empty text, name: empty, widget: string }
              - label: Events
                name: events
                widget: list
                summary: '{{fields.date}} — {{fields.title}}'
                fields:
                  - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
                  - { label: Date label, name: date_label, widget: string, required: false }
                  - { label: Time, name: time, widget: string, required: false }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Stream URL, name: streamurl, widget: string, required: false }
          - { label: Body, name: body, widget: markdown, required: false }

      - name: calendar_ru
        label: Календарь RU
        file: content/calendar/_index.ru.md
        format: toml-frontmatter
        fields:
          - { label: Заголовок, name: title, widget: string }
          - { label: Описание, name: description, widget: text }
          - { label: Шаблон, name: template, widget: hidden, default: calendar/section.html }
          - label: Extra
            name: extra
            widget: object
            fields:
              - { label: Вступление, name: intro, widget: text }
              - { label: Заголовок виджета, name: widget_title, widget: string }
              - { label: Текст пустого календаря, name: empty, widget: string }
              - label: События
                name: events
                widget: list
                summary: '{{fields.date}} — {{fields.title}}'
                fields:
                  - { label: Дата, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
                  - { label: Подпись даты, name: date_label, widget: string, required: false }
                  - { label: Время, name: time, widget: string, required: false }
                  - { label: Заголовок, name: title, widget: string }
                  - { label: Описание, name: description, widget: text }
                  - { label: Stream URL, name: streamurl, widget: string, required: false }
          - { label: Текст страницы, name: body, widget: markdown, required: false }

      - name: calendar_bg
        label: Календар BG
        file: content/calendar/_index.bg.md
        format: toml-frontmatter
        fields:
          - { label: Заглавие, name: title, widget: string }
          - { label: Описание, name: description, widget: text }
          - { label: Шаблон, name: template, widget: hidden, default: calendar/section.html }
          - label: Extra
            name: extra
            widget: object
            fields:
              - { label: Въведение, name: intro, widget: text }
              - { label: Заглавие на widget, name: widget_title, widget: string }
              - { label: Текст при празен календар, name: empty, widget: string }
              - label: Събития
                name: events
                widget: list
                summary: '{{fields.date}} — {{fields.title}}'
                fields:
                  - { label: Дата, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
                  - { label: Етикет на дата, name: date_label, widget: string, required: false }
                  - { label: Час, name: time, widget: string, required: false }
                  - { label: Заглавие, name: title, widget: string }
                  - { label: Описание, name: description, widget: text }
                  - { label: Stream URL, name: streamurl, widget: string, required: false }
          - { label: Текст на страницата, name: body, widget: markdown, required: false }
