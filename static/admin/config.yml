# ### {"repository_full_name":"ek-larionova/site","path":"static/admin/config.yml","sha":"21668769d0de9b961cde6efa2902ceb890aa57c6","message":"Localize CMS and add about management","content":
#
backend:
  name: github
  repo: ek-larionova/site
  branch: main
  site_domain: subtle-swan-6ef426.netlify.app
##local_backend: true
locale: ru
site_url: https://www.ekaterinalarionova.eu
display_url: https://www.ekaterinalarionova.eu

# publish_mode: editorial_workflow

media_folder: static/images/uploads
public_folder: /images/uploads

collections:
  - name: calendar
    label: Календарь
    delete: false
    editor:
      preview: false
    files:
      - name: calendar_en
        label: Календарь — EN
        file: content/calendar/_index.md
        format: toml-frontmatter
        fields:
          - { label: Заголовок, name: title, widget: string }
          - { label: Описание, name: description, widget: text }
          - {
              label: Шаблон,
              name: template,
              widget: hidden,
              default: calendar/section.html,
            }
          - label: Настройки блока
            name: extra
            widget: object
            fields:
              - { label: Вступительный текст, name: intro, widget: text }
              - { label: Заголовок виджета, name: widget_title, widget: string }
              - {
                  label: Текст при пустом календаре,
                  name: empty,
                  widget: string,
                }
              - label: События
                name: events
                widget: list
                summary: "{{fields.date}} — {{fields.title}}"
                fields:
                  - {
                      label: Дата,
                      name: date,
                      widget: datetime,
                      date_format: DD-MM-YYYY,
                      time_format: false,
                      format: DD-MM-YYYY,
                    }
                  - {
                      label: Подпись даты,
                      name: date_label,
                      widget: string,
                      required: false,
                    }
                  - {
                      label: Время,
                      name: time,
                      widget: string,
                      required: false,
                    }
                  - { label: Заголовок события, name: title, widget: string }
                  - { label: Описание события, name: description, widget: text }
                  - {
                      label: Ссылка на трансляцию,
                      name: streamurl,
                      widget: string,
                      required: false,
                    }
          - {
              label: Текст страницы,
              name: body,
              widget: markdown,
              required: false,
            }

